[project]
name = "rds-mysql-upgrade-assistant"
version = "0.1.0"
description = "Automates batch blue/green-style major version upgrades for Huawei Cloud RDS for MySQL 8.0 to 8.4"
readme = "README.md"
license = "MIT-0"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0",
    "huaweicloudsdkcore>=3.1.100",
    "huaweicloudsdkrds>=3.1.100",
    "huaweicloudsdkdrs>=3.1.100",
    "huaweicloudsdkiam>=3.1.100",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rds_upgrade_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
